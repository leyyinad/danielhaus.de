image: node:18-alpine

stages:
  - npm
  - lint
  - build
  - test
  - deploy

npm:
  stage: npm
  script:
    - npm install
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  artifacts:
    expire_in: 1 days
    when: on_success
    paths:
      - node_modules/

lint:
  stage: lint
  script:
    - npm run lint

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - build/

test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.39.0-jammy
  script:
    - npm test

deploy_staging:
  stage: deploy
  environment:
    name: Staging
  script:
    - echo "Deploy to staging server"
    - apk add lftp
    - lftp -c "open -u $FTP_USER_STAGING,$FTP_PASS_STAGING $FTP_HOST_STAGING; mirror -Rev -X .ht* build/ . --parallel=10"
  only:
    refs:
      - staging

deploy_dev:
  stage: deploy
  environment:
    name: Develop
  script:
    - echo "Deploy to dev server"
    - apk add lftp
    - ls -l
    - lftp -c "open -u $FTP_USER_DEV,$FTP_PASS_DEV $FTP_HOST_DEV; mirror -Rev -X .ht* build/ . --parallel=10"
  only:
    refs:
      - main
