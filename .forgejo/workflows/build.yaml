name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - '.deploy/**'

env:
  PUBLIC_GITHUB_REF_NAME: ${{ vars.GITHUB_REF_NAME }}
  PUBLIC_GITHUB_SHA: ${{ vars.GITHUB_SHA }}
  PUBLIC_GITHUB_RELEASE_VERSION: ''
  PUBLIC_BUILD_DATE: ''

jobs:
  test:
    name: Test
    runs-on: docker

    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble

    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run db:push -- --force
      - run: npm test

  build:
    name: Build
    runs-on: docker
    needs: test
    if: forge.event_name == 'push'

    container:
      image: ghcr.io/catthehacker/ubuntu:js-latest

    env:
      REGISTRY: code.d7c.de
      ACTIONS_USER: actions

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.ACTIONS_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - id: tag
        run: |
          {
            echo IMAGE_TAG=${GITHUB_REF_NAME}-$(echo $GITHUB_SHA | sed -r 's/(.......).+/\1/')-$(date +%s)
            echo BUILD_DATE=$(date -Iminutes)
          } >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY }}:${{ steps.tag.outputs.IMAGE_TAG }}
          build-args: |
            GITHUB_REF_NAME=${{ env.GITHUB_REF_NAME }}
            GITHUB_SHA=${{ env.GITHUB_SHA }}
            BUILD_DATE=${{ steps.tag.outputs.BUILD_DATE }}
