name: Release

on:
  push:
    branches:
      - release

jobs:
  release:
    name: Release
    runs-on: docker

    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest

    env:
      REGISTRY: code.d7c.de
      ACTIONS_USER: actions

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: npm install --no-save @semantic-release/git @semantic-release/changelog

      - id: semrel
        run: |
          SEMREL_OUTPUT=$(npx semantic-release)
          echo $SEMREL_OUTPUT
          RELEASE_VERSION=$(echo "$SEMREL_OUTPUT" | awk '/The next release version is/ { print $NF }')
          echo $RELEASE_VERSION
          {
            echo RELEASE_VERSION=$RELEASE_VERSION
            echo RELEASE_SHA=$(git rev-parse HEAD)
            echo VERSION_MAJOR=$(echo $RELEASE_VERSION | sed -r 's/([0-9]+)\.[0-9]+\.[0-9]+/\1/')
            echo VERSION_MAJOR_MINOR=$(echo $RELEASE_VERSION | sed -r 's/([0-9]+\.[0-9]+)\.[0-9]+/\1/')
          } >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.ACTIONS_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY }}:${{ steps.semrel.outputs.RELEASE_VERSION }}
            ${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY }}:${{ steps.semrel.outputs.VERSION_MAJOR_MINOR }}
            ${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY }}:${{ steps.semrel.outputs.VERSION_MAJOR }}
          build-args: |
            GITHUB_REF_NAME=""
            GITHUB_SHA=${{ env.GITHUB_SHA }}
            GITHUB_RELEASE_VERSION=${{ steps.semrel.outputs.RELEASE_VERSION }}
