apiVersion: apps/v1
kind: Deployment
metadata:
  name: danielhaus-de-staging
  namespace: danielhaus
  labels:
    app: danielhaus-de
    environment: staging
spec:
  replicas: 1
  # securityContext:
  #runAsNonRoot: true
  #runAsUser: ?
  selector:
    matchLabels:
      app: danielhaus-de
      environment: staging
  template:
    metadata:
      labels:
        app: danielhaus-de
        environment: staging
    spec:
      containers:
        - name: danielhaus-de
          image: code.d7c.de/danielhaus/danielhaus.de:staging-45cddab-1763484747 # {"$imagepolicy": "danielhaus:danielhaus-de-staging"}
          imagePullPolicy: Always
          ports:
            - name: web
              containerPort: 3000
          # securityContext:
          #   readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
            limits:
              memory: '256Mi'
      imagePullSecrets:
        - name: org-registry-access-token
---
apiVersion: v1
kind: Service
metadata:
  name: danielhaus-de-staging
  namespace: danielhaus
  labels:
    app: danielhaus-de
    environment: staging
spec:
  selector:
    app: danielhaus-de
    environment: staging
  ports:
    - name: web
      port: 3000
      targetPort: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: danielhaus-de-staging
  namespace: danielhaus
  labels:
    app: danielhaus-de
    environment: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.className: traefik
spec:
  tls:
    - hosts:
        - danielhaus.de.staging.d7c.de
      secretName: danielhaus-de-staging-d7c-de-tls
  rules:
    - host: danielhaus.de.staging.d7c.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: danielhaus-de-staging
                port:
                  number: 3000
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: danielhaus-de-staging
  namespace: danielhaus
spec:
  imageRepositoryRef:
    name: danielhaus.de
  filterTags:
    pattern: '^staging-[a-fA-F0-9]+-(?P<ts>.*)'
    extract: '$ts'
  policy:
    numerical:
      order: asc
